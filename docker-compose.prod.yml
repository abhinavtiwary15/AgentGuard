version: '3.8'

services:
  backend:
    build:
      context: ./agentguard-backend
      dockerfile: Dockerfile
    container_name: agentguard-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - ./agentguard-backend/.env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - agentguard-prod-network

  frontend:
    build:
      context: ./agentguard-frontend
      dockerfile: Dockerfile
    container_name: agentguard-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - agentguard-prod-network

networks:
  agentguard-prod-network:
    driver: bridge
